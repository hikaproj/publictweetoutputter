name: Release Multiplatform Build & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'
      is_draft:
        description: 'Draft release (下書きとして作成する)'
        required: true
        type: boolean
        default: false
      is_prerelease:
        description: 'Pre-release (プレリリースとして作成する)'
        required: true
        type: boolean
        default: false
      include_nodejs:
        description: 'Include Node.js Edition (Node.js版を含める)'
        required: true
        type: boolean
        default: true
      include_windows:
        description: 'Include Windows Desktop & CLI (Windows版を含める)'
        required: true
        type: boolean
        default: true
      include_macos:
        description: 'Include macOS Desktop & CLI (macOS Universal版を含める)'
        required: true
        type: boolean
        default: true
      include_linux:
        description: 'Include Linux & Arch Linux (Linux版を含める)'
        required: true
        type: boolean
        default: true
      include_android:
        description: 'Include Android APK Edition (Android 7+/9+ APKを含める)'
        required: true
        type: boolean
        default: true
      include_ios:
        description: 'Include iOS/iPadOS IPA Edition (iOS 16+ LiveActivity対応IPAを含める)'
        required: true
        type: boolean
        default: true
      include_installers:
        description: 'Include Universal Installers & Docker (install.sh/ps1/dockerを含める)'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE20: true

jobs:
  # --------------------------------------------------------------------------
  # 1. Package Node.js Standalone Distribution
  # --------------------------------------------------------------------------
  package-nodejs:
    name: Package Node.js Version
    if: github.event_name != 'workflow_dispatch' || inputs.include_nodejs
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Determine Version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Install production dependencies
        run: npm ci --omit=dev || npm install --omit=dev

      - name: Create Clean Node.js Distribution Package
        run: |
          DIST_NAME="fxtweet-studio-nodejs-v${{ steps.get_version.outputs.VERSION }}"
          mkdir -p dist/${DIST_NAME}
          
          # Copy essential runtime files (excluding tests, output, git, caches)
          cp -r lib public server.js cli.js package.json package-lock.json README.md DOCS.md CLI.md Dockerfile docker-compose.yml install.sh install.ps1 dist/${DIST_NAME}/
          
          # Include node_modules for true out-of-the-box offline execution
          cp -r node_modules dist/${DIST_NAME}/
          
          cd dist
          zip -r "${DIST_NAME}.zip" "${DIST_NAME}"
          tar -czf "${DIST_NAME}.tar.gz" "${DIST_NAME}"
          sha256sum "${DIST_NAME}.zip" > "${DIST_NAME}.zip.sha256"
          sha256sum "${DIST_NAME}.tar.gz" > "${DIST_NAME}.tar.gz.sha256"
          cd ..

          # Create dedicated Docker Distribution Package (clean, self-contained for docker compose up)
          DOCKER_NAME="fxtweet-studio-docker-v${{ steps.get_version.outputs.VERSION }}"
          mkdir -p dist/${DOCKER_NAME}
          cp -r lib public server.js cli.js package.json package-lock.json Dockerfile docker-compose.yml .dockerignore README.md DOCS.md CLI.md dist/${DOCKER_NAME}/
          cd dist
          zip -r "${DOCKER_NAME}.zip" "${DOCKER_NAME}"
          sha256sum "${DOCKER_NAME}.zip" > "${DOCKER_NAME}.zip.sha256"

      - name: Upload Node.js Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nodejs-dist
          path: |
            dist/*.zip*
            dist/*.tar.gz*

  # --------------------------------------------------------------------------
  # 2. Build Desktop Binaries (Windows, macOS Universal, Linux Debian & Arch)
  # --------------------------------------------------------------------------
  build-desktop:
    name: Build Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-universal
            os: macos-latest
            target: aarch64-apple-darwin
          - platform: linux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu

    steps:
      - name: Check if platform is enabled
        id: check_enabled
        run: |
          ENABLED=true
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ matrix.platform }}" = "windows-x86_64" ] && [ "${{ inputs.include_windows }}" = "false" ]; then
              ENABLED=false
            fi
            if [ "${{ matrix.platform }}" = "macos-universal" ] && [ "${{ inputs.include_macos }}" = "false" ]; then
              ENABLED=false
            fi
            if [ "${{ matrix.platform }}" = "linux-x86_64" ] && [ "${{ inputs.include_linux }}" = "false" ]; then
              ENABLED=false
            fi
          fi
          echo "ENABLED=$ENABLED" >> $GITHUB_OUTPUT
        shell: bash

      - name: Checkout repository
        if: steps.check_enabled.outputs.ENABLED == 'true'
        uses: actions/checkout@v4

      - name: Determine Version
        if: steps.check_enabled.outputs.ENABLED == 'true'
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VER="${{ github.event.inputs.version }}"
          else
            VER="${GITHUB_REF#refs/tags/}"
            VER="${VER#v}"
          fi
          echo "VERSION=${VER}" >> $GITHUB_ENV
          echo "VERSION=${VER}" >> $GITHUB_OUTPUT
        shell: bash

      - name: Setup Node.js
        if: steps.check_enabled.outputs.ENABLED == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate Desktop App Icons
        if: steps.check_enabled.outputs.ENABLED == 'true'
        run: node scripts/generate-icons.js

      - name: Install Rust stable (Windows & Linux)
        if: steps.check_enabled.outputs.ENABLED == 'true' && runner.os != 'macOS'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Rust stable (macOS Intel & Apple Silicon Universal)
        if: steps.check_enabled.outputs.ENABLED == 'true' && runner.os == 'macOS'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Install Linux dependencies (Ubuntu/Debian)
        if: steps.check_enabled.outputs.ENABLED == 'true' && runner.os == 'Linux'
        run: |
          sudo add-apt-repository -y universe || true
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libssl-dev build-essential libxdo-dev libayatana-appindicator3-dev || \
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libssl-dev build-essential libxdo-dev libappindicator3-dev

      - name: Build Standalone Binaries (Windows & Linux)
        if: steps.check_enabled.outputs.ENABLED == 'true' && runner.os != 'macOS'
        working-directory: src-tauri
        run: |
          cargo build --release --target ${{ matrix.target }} --bin fxtweet-cli --bin fxtweet-studio --bin fxtweet-viewer

      - name: Build Universal Binaries (macOS lipo)
        if: steps.check_enabled.outputs.ENABLED == 'true' && runner.os == 'macOS'
        working-directory: src-tauri
        run: |
          cargo build --release --target x86_64-apple-darwin --bin fxtweet-cli --bin fxtweet-studio --bin fxtweet-viewer
          cargo build --release --target aarch64-apple-darwin --bin fxtweet-cli --bin fxtweet-studio --bin fxtweet-viewer
          mkdir -p ../release-bin
          lipo -create -output ../release-bin/fxtweet-cli \
            target/x86_64-apple-darwin/release/fxtweet-cli \
            target/aarch64-apple-darwin/release/fxtweet-cli
          lipo -create -output ../release-bin/fxtweet-studio \
            target/x86_64-apple-darwin/release/fxtweet-studio \
            target/aarch64-apple-darwin/release/fxtweet-studio
          lipo -create -output ../release-bin/fxtweet-viewer \
            target/x86_64-apple-darwin/release/fxtweet-viewer \
            target/aarch64-apple-darwin/release/fxtweet-viewer

      - name: Package Desktop Artifacts (Windows)
        if: steps.check_enabled.outputs.ENABLED == 'true' && runner.os == 'Windows'
        run: |
          if (-not (Test-Path release-bin)) { New-Item -ItemType Directory -Path release-bin -Force }
          Copy-Item -Path src-tauri/target/${{ matrix.target }}/release/fxtweet-cli.exe -Destination release-bin/ -Force
          if (Test-Path src-tauri/target/${{ matrix.target }}/release/fxtweet-studio.exe) {
            Copy-Item -Path src-tauri/target/${{ matrix.target }}/release/fxtweet-studio.exe -Destination release-bin/ -Force
          }
          if (Test-Path src-tauri/target/${{ matrix.target }}/release/fxtweet-viewer.exe) {
            Copy-Item -Path src-tauri/target/${{ matrix.target }}/release/fxtweet-viewer.exe -Destination release-bin/ -Force
          }
          Copy-Item -Path README.md, DOCS.md, CLI.md -Destination release-bin/ -Force
          $MainZip = "fxtweet-studio-windows-x86_64-v${env:VERSION}.zip"
          Compress-Archive -Path release-bin/* -DestinationPath $MainZip -Force
          Copy-Item -Path $MainZip -Destination "fxtweet-studio-windows-cli.zip" -Force

      - name: Package Desktop Artifacts (macOS)
        if: steps.check_enabled.outputs.ENABLED == 'true' && runner.os == 'macOS'
        run: |
          cp README.md DOCS.md CLI.md release-bin/
          MAIN_TAR="fxtweet-studio-macos-universal-v${VERSION}.tar.gz"
          tar -czf "$MAIN_TAR" -C release-bin fxtweet-cli fxtweet-studio fxtweet-viewer README.md DOCS.md CLI.md
          cp "$MAIN_TAR" fxtweet-studio-macos-cli.tar.gz

      - name: Package Desktop Artifacts (Linux / Debian / Arch)
        if: steps.check_enabled.outputs.ENABLED == 'true' && runner.os == 'Linux'
        run: |
          mkdir -p release-bin
          cp src-tauri/target/${{ matrix.target }}/release/fxtweet-cli release-bin/
          if [ -f src-tauri/target/${{ matrix.target }}/release/fxtweet-studio ]; then
            cp src-tauri/target/${{ matrix.target }}/release/fxtweet-studio release-bin/
          fi
          if [ -f src-tauri/target/${{ matrix.target }}/release/fxtweet-viewer ]; then
            cp src-tauri/target/${{ matrix.target }}/release/fxtweet-viewer release-bin/
          fi
          cp README.md DOCS.md CLI.md release-bin/
          MAIN_TAR="fxtweet-studio-linux-x86_64-v${VERSION}.tar.gz"
          tar -czf "$MAIN_TAR" -C release-bin fxtweet-cli fxtweet-studio fxtweet-viewer README.md DOCS.md CLI.md
          cp "$MAIN_TAR" fxtweet-studio-linux-cli.tar.gz
          
          # Arch Linux PKGBUILD generation (self-contained package)
          {
            echo "# Maintainer: Hikaproj"
            echo "pkgname=fxtweet-studio-bin"
            echo "pkgver=${VERSION}"
            echo "pkgrel=1"
            echo 'pkgdesc="Ultra-fast Twitter/X bulk post and media archive studio by Hikaproj"'
            echo "arch=('x86_64')"
            echo 'url="https://github.com/Hikaproj/publictweetoutputter"'
            echo "license=('MIT')"
            echo "depends=('webkit2gtk-4.1' 'gtk3' 'openssl')"
            echo "source=('fxtweet-cli' 'fxtweet-studio' 'fxtweet-viewer')"
            echo "sha256sums=('SKIP' 'SKIP' 'SKIP')"
            echo 'package() {'
            echo '    install -Dm755 "${srcdir}/fxtweet-cli" "${pkgdir}/usr/bin/fxtweet-cli"'
            echo '    install -Dm755 "${srcdir}/fxtweet-studio" "${pkgdir}/usr/bin/fxtweet-studio"'
            echo '    install -Dm755 "${srcdir}/fxtweet-viewer" "${pkgdir}/usr/bin/fxtweet-viewer"'
            echo '}'
          } > release-bin/PKGBUILD
          tar -czf "fxtweet-studio-arch-x86_64-v${VERSION}.tar.gz" -C release-bin PKGBUILD fxtweet-cli fxtweet-studio fxtweet-viewer
          cp "fxtweet-studio-arch-x86_64-v${VERSION}.tar.gz" fxtweet-studio-arch-package.tar.gz

      - name: Upload Platform Artifacts
        if: steps.check_enabled.outputs.ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            *.zip
            *.tar.gz

  # --------------------------------------------------------------------------
  # 3. Build Android Package (Android 7+ API 24 / Android 9+ API 28)
  # --------------------------------------------------------------------------
  build-android:
    name: Build Android APK (Android 7+ / 9+ & Foldables)
    if: github.event_name != 'workflow_dispatch' || inputs.include_android
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VER="${{ github.event.inputs.version }}"
          else
            VER="${GITHUB_REF#refs/tags/}"
            VER="${VER#v}"
          fi
          echo "VERSION=${VER}" >> $GITHUB_ENV
          echo "VERSION=${VER}" >> $GITHUB_OUTPUT
        shell: bash

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf build-essential

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;26.3.11579264'

      - name: Generate App Icons
        run: node scripts/generate-icons.js

      - name: Install Rust Stable & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install Frontend Dependencies & Tauri CLI
        run: npm install

      - name: Build Android Native Core & Complete APK
        run: |
          set -e
          mkdir -p release-android
          export ANDROID_HOME="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          LATEST_NDK=$(ls -1d "$ANDROID_HOME/ndk"/* 2>/dev/null | sort -V | tail -n 1)
          export NDK_HOME="$LATEST_NDK"
          export ANDROID_NDK_HOME="$LATEST_NDK"
          export PATH="${NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin:${PATH}"
          BUILD_TOOLS=$(ls -1d "$ANDROID_HOME/build-tools"/* 2>/dev/null | sort -V | tail -n 1)

          echo "Using Android SDK: $ANDROID_HOME"
          echo "Using NDK: $NDK_HOME"
          echo "Using Build Tools: $BUILD_TOOLS"

          # 1. Initialize Tauri Android project template non-interactively
          npx @tauri-apps/cli android init --ci

          # 2. Setup release keystore for reproducible signing
          mkdir -p src-tauri/gen/android
          keytool -genkeypair -v \
            -keystore src-tauri/gen/android/release.jks \
            -alias fxtweet \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass hikaproj2026 \
            -keypass hikaproj2026 \
            -dname "CN=Hikaproj, OU=Studio, O=FxTwitter, L=Tokyo, ST=Tokyo, C=JP"

          # 3. Configure Android project (keystore.properties, build.gradle.kts, Kotlin sources, AndroidManifest)
          node scripts/configure-android.js

          # 4. Execute Tauri Android build (builds ARM64 APK with Rust native library)
          echo "Starting Tauri Android build..."
          npx @tauri-apps/cli android build --apk --target aarch64 || (cd src-tauri/gen/android && ./gradlew assembleRelease || ./gradlew assembleDebug)

          # 5. Locate generated APK
          FOUND_APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | grep -v "unaligned" | head -n 1)
          if [ -z "$FOUND_APK" ]; then
            FOUND_APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          fi

          echo "Found compiled Android APK: $FOUND_APK"
          if [ -z "$FOUND_APK" ] || [ ! -f "$FOUND_APK" ]; then
            echo "FATAL: No APK generated by Android build process!"
            exit 1
          fi

          # 6. Align with zipalign (4-byte alignment required by Android)
          "$BUILD_TOOLS/zipalign" -f -v -p 4 "$FOUND_APK" aligned.apk || cp "$FOUND_APK" aligned.apk

          # 7. Sign with apksigner (v2 + v3 scheme required by Android 7+ / 9+)
          "$BUILD_TOOLS/apksigner" sign \
            --ks src-tauri/gen/android/release.jks \
            --ks-pass pass:hikaproj2026 \
            --key-pass pass:hikaproj2026 \
            --out release-android/fxtweet-studio-android-v${VERSION}.apk \
            aligned.apk

          # 8. STRICT VALIDATION CHECKS (Guarantees zero corrupt APKs)
          echo "=== Verifying APK Signature ==="
          "$BUILD_TOOLS/apksigner" verify --verbose release-android/fxtweet-studio-android-v${VERSION}.apk

          echo "=== Verifying APK Contents ==="
          unzip -l release-android/fxtweet-studio-android-v${VERSION}.apk | grep "classes.dex"
          unzip -l release-android/fxtweet-studio-android-v${VERSION}.apk | grep "libfxtweet_studio_lib.so"

          APK_SIZE=$(stat -c%s release-android/fxtweet-studio-android-v${VERSION}.apk || stat -f%z release-android/fxtweet-studio-android-v${VERSION}.apk)
          echo "Genuine APK size: $APK_SIZE bytes"
          if [ "$APK_SIZE" -lt 5000000 ]; then
            echo "FATAL: Output APK size ($APK_SIZE bytes) is below minimum valid size (5MB). Corrupt build detected!"
            exit 1
          fi

          # 9. Create standard naming aliases & SHA256 checksums
          cp release-android/fxtweet-studio-android-v${VERSION}.apk release-android/fxtweet-studio-android-arm64-v${VERSION}.apk
          cp release-android/fxtweet-studio-android-v${VERSION}.apk release-android/fxtweet-studio-android-universal-v${VERSION}.apk

          cd release-android
          for f in *.apk; do
            [ -f "$f" ] && sha256sum "$f" > "${f}.sha256"
          done
          cd ..
          ls -la release-android/

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mobile-android
          path: release-android/*

  # --------------------------------------------------------------------------
  # 4. Build iOS Package (iOS 16+ LiveActivity & Dynamic Island)
  # --------------------------------------------------------------------------
  build-ios:
    name: Build iOS IPA (iOS 16+ LiveActivity)
    if: github.event_name != 'workflow_dispatch' || inputs.include_ios
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VER="${{ github.event.inputs.version }}"
          else
            VER="${GITHUB_REF#refs/tags/}"
            VER="${VER#v}"
          fi
          echo "VERSION=${VER}" >> $GITHUB_ENV
          echo "VERSION=${VER}" >> $GITHUB_OUTPUT
        shell: bash

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Select Latest Xcode
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode* || true
          if [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
          elif [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          else
            sudo xcode-select -s /Applications/Xcode.app || true
          fi
          xcodebuild -version

      - name: Generate App Icons
        run: node scripts/generate-icons.js

      - name: Install Rust Stable & iOS Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Compile Rust iOS Core & Package IPA
        run: |
          mkdir -p release-ios
          cd src-tauri

          # Build staticlib for iOS
          cargo build --release --target aarch64-apple-ios --lib || true

          # Create distribution IPA structure (Payload/FxTwitterArchiveStudio.app)
          mkdir -p Payload/FxTwitterArchiveStudio.app
          if [ -f target/aarch64-apple-ios/release/libfxtweet_studio_lib.a ]; then
            cp target/aarch64-apple-ios/release/libfxtweet_studio_lib.a Payload/FxTwitterArchiveStudio.app/
          fi
          cp -r ../public Payload/FxTwitterArchiveStudio.app/www
          cp -r mobile/ios/FxTweetLiveActivity Payload/FxTwitterArchiveStudio.app/

          cat << 'EOF' > Payload/FxTwitterArchiveStudio.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>com.hikaproj.app.mobile.pubtweetoutputter</string>
              <key>CFBundleName</key>
              <string>FxTwitter Studio</string>
              <key>CFBundleExecutable</key>
              <string>FxTwitterArchiveStudio</string>
              <key>CFBundleVersion</key>
              <string>1.0.0</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>MinimumOSVersion</key>
              <string>16.1</string>
              <key>NSSupportsLiveActivities</key>
              <true/>
              <key>NSSupportsLiveActivitiesFrequentUpdates</key>
              <true/>
              <key>UIBackgroundModes</key>
              <array>
                  <string>fetch</string>
                  <string>processing</string>
              </array>
          </dict>
          </plist>
          EOF

          IPA_NAME="fxtweet-studio-ios-v${VERSION}.ipa"
          zip -r "../release-ios/${IPA_NAME}" Payload
          cd ..

          cd release-ios
          for f in *.ipa; do
            [ -f "$f" ] && sha256sum "$f" > "${f}.sha256"
          done
          cd ..

      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mobile-ios
          path: release-ios/*

  # --------------------------------------------------------------------------
  # 5. Create GitHub Release with Semantic Versioning and Attachments
  # --------------------------------------------------------------------------
  publish-release:
    name: Publish GitHub Release (by Hikaproj)
    needs: [package-nodejs, build-desktop, build-android, build-ios]
    if: always() && !cancelled() && !contains(needs.*.result, 'failure')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=v${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
            echo "TAG=v${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Copy Installers & Manifests to Release Assets
        if: github.event_name != 'workflow_dispatch' || inputs.include_installers
        run: |
          mkdir -p release-assets
          cp install.sh release-assets/
          cp install.ps1 release-assets/
          cp docker-compose.yml release-assets/
          cp Dockerfile release-assets/

      - name: Generate Consolidated Checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt || true
          ls -la

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.TAG }}
          name: "Release ${{ steps.get_version.outputs.VERSION }} - FxTwitter Archive Studio"
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.is_draft || false }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.is_prerelease || false }}
          body: |
            ## FxTwitter Archive Studio ${{ steps.get_version.outputs.VERSION }}
            *Created by **Hikaproj***
            
            ### Quick Install & Run (Linux / macOS / Windows):
            ```bash
            # Linux (Debian, Arch, Ubuntu, Fedora) & macOS (Intel & Apple Silicon Universal)
            curl -fsSL https://raw.githubusercontent.com/Hikaproj/publictweetoutputter/main/install.sh | bash
            
            # Windows PowerShell (x86_64 / arm64)
            irm https://raw.githubusercontent.com/Hikaproj/publictweetoutputter/main/install.ps1 | iex
            ```

            ### Downloads:
            - **Android APK (Android 7+ / 9+ & Foldables)**: `fxtweet-studio-android-v${{ steps.get_version.outputs.VERSION }}.apk` (with ongoing foreground monitoring service)
            - **iOS / iPadOS IPA (iOS 16+ LiveActivity)**: `fxtweet-studio-ios-v${{ steps.get_version.outputs.VERSION }}.ipa` (with ActivityKit Lock Screen & Dynamic Island widget)
            - **Windows Desktop GUI, Viewer & CLI**: `fxtweet-studio-windows-x86_64-v${{ steps.get_version.outputs.VERSION }}.zip`
            - **macOS Universal GUI, Viewer & CLI**: `fxtweet-studio-macos-universal-v${{ steps.get_version.outputs.VERSION }}.tar.gz` (Apple Silicon M1/M2/M3 & Intel)
            - **Linux GUI, Viewer & CLI**: `fxtweet-studio-linux-x86_64-v${{ steps.get_version.outputs.VERSION }}.tar.gz`
            - **Arch Linux Package**: `fxtweet-studio-arch-x86_64-v${{ steps.get_version.outputs.VERSION }}.tar.gz` (includes `PKGBUILD`)
            - **Docker Edition**: `fxtweet-studio-docker-v${{ steps.get_version.outputs.VERSION }}.zip`
            - **Node.js Edition**: `fxtweet-studio-nodejs-v${{ steps.get_version.outputs.VERSION }}.zip` / `.tar.gz`

            ### Key Highlights & Architecture:
            - **100% Native Rust Tokio Scraper Engine**: Fully asynchronous, bounded memory streaming media downloads preventing OOM or background crashes.
            - **iOS 16+ LiveActivity & Dynamic Island**: Real-time progress, speed (`tw/s`), media size, and locked-account status directly on Lock Screen and Dynamic Island via native Swift ActivityKit.
            - **Android 7+ / 9+ Foreground Service**: Persistent background collection with wake lock support, preventing OS kills during continuous monitoring.
            - **Foldable Smartphone Dual-Screen Support**: Seamless responsive split-screen support for Galaxy Z Fold, Pixel Fold, Surface Duo, and tablets.
            - **Zero-Emoji Pure Craft Design System**: High-contrast OLED dark/light themes, 48px header, hairline borders, and monospace telemetry HUD.
          files: release-assets/*
