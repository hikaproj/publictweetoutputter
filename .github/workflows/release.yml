name: Release Multiplatform Build & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'
      is_draft:
        description: 'Draft release (下書きとして作成する)'
        required: true
        type: boolean
        default: false
      is_prerelease:
        description: 'Pre-release (プレリリースとして作成する)'
        required: true
        type: boolean
        default: false
      include_nodejs:
        description: 'Include Node.js Edition (Node.js版を含める)'
        required: true
        type: boolean
        default: true
      include_windows:
        description: 'Include Windows Desktop & CLI (Windows版を含める)'
        required: true
        type: boolean
        default: true
      include_macos:
        description: 'Include macOS Desktop & CLI (macOS Universal版を含める)'
        required: true
        type: boolean
        default: true
      include_linux:
        description: 'Include Linux & Arch Linux (Linux版を含める)'
        required: true
        type: boolean
        default: true
      include_installers:
        description: 'Include Universal Installers & Docker (install.sh/ps1/dockerを含める)'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE20: true

jobs:
  # --------------------------------------------------------------------------
  # 1. Package Node.js Standalone Distribution
  # --------------------------------------------------------------------------
  package-nodejs:
    name: Package Node.js Version
    if: github.event_name != 'workflow_dispatch' || inputs.include_nodejs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Determine Version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Install production dependencies
        run: npm ci --omit=dev || npm install --omit=dev

      - name: Create Clean Node.js Distribution Package
        run: |
          DIST_NAME="fxtweet-studio-nodejs-v${{ steps.get_version.outputs.VERSION }}"
          mkdir -p dist/${DIST_NAME}
          
          # Copy essential runtime files (excluding tests, output, git, caches)
          cp -r lib public server.js cli.js package.json package-lock.json README.md DOCS.md CLI.md Dockerfile docker-compose.yml install.sh install.ps1 dist/${DIST_NAME}/
          
          # Include node_modules for true out-of-the-box offline execution
          cp -r node_modules dist/${DIST_NAME}/
          
          cd dist
          zip -r "${DIST_NAME}.zip" "${DIST_NAME}"
          tar -czf "${DIST_NAME}.tar.gz" "${DIST_NAME}"
          sha256sum "${DIST_NAME}.zip" > "${DIST_NAME}.zip.sha256"
          sha256sum "${DIST_NAME}.tar.gz" > "${DIST_NAME}.tar.gz.sha256"
          cd ..

          # Create dedicated Docker Distribution Package (clean, self-contained for docker compose up)
          DOCKER_NAME="fxtweet-studio-docker-v${{ steps.get_version.outputs.VERSION }}"
          mkdir -p dist/${DOCKER_NAME}
          cp -r lib public server.js cli.js package.json package-lock.json Dockerfile docker-compose.yml .dockerignore README.md DOCS.md CLI.md dist/${DOCKER_NAME}/
          cd dist
          zip -r "${DOCKER_NAME}.zip" "${DOCKER_NAME}"
          sha256sum "${DOCKER_NAME}.zip" > "${DOCKER_NAME}.zip.sha256"

      - name: Upload Node.js Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nodejs-dist
          path: |
            dist/*.zip*
            dist/*.tar.gz*

  # --------------------------------------------------------------------------
  # 2. Build Desktop Binaries (Windows, macOS Universal, Linux Debian & Arch)
  # --------------------------------------------------------------------------
  build-desktop:
    name: Build Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-universal
            os: macos-latest
            target: aarch64-apple-darwin
          - platform: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    steps:
      - name: Check if platform is enabled
        id: check_enabled
        run: |
          ENABLED=true
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ matrix.platform }}" = "windows-x86_64" ] && [ "${{ inputs.include_windows }}" = "false" ]; then
              ENABLED=false
            fi
            if [ "${{ matrix.platform }}" = "macos-universal" ] && [ "${{ inputs.include_macos }}" = "false" ]; then
              ENABLED=false
            fi
            if [ "${{ matrix.platform }}" = "linux-x86_64" ] && [ "${{ inputs.include_linux }}" = "false" ]; then
              ENABLED=false
            fi
          fi
          echo "ENABLED=$ENABLED" >> $GITHUB_OUTPUT
        shell: bash

      - name: Checkout repository
        if: steps.check_enabled.outputs.ENABLED == 'true'
        uses: actions/checkout@v4

      - name: Determine Version
        if: steps.check_enabled.outputs.ENABLED == 'true'
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VER="${{ github.event.inputs.version }}"
          else
            VER="${GITHUB_REF#refs/tags/}"
            VER="${VER#v}"
          fi
          echo "VERSION=${VER}" >> $GITHUB_ENV
          echo "VERSION=${VER}" >> $GITHUB_OUTPUT
        shell: bash

      - name: Setup Node.js
        if: steps.check_enabled.outputs.ENABLED == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate Desktop App Icons
        if: steps.check_enabled.outputs.ENABLED == 'true'
        run: node scripts/generate-icons.js

      - name: Install Rust stable (Windows & Linux)
        if: steps.check_enabled.outputs.ENABLED == 'true' && runner.os != 'macOS'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Rust stable (macOS Intel & Apple Silicon Universal)
        if: steps.check_enabled.outputs.ENABLED == 'true' && runner.os == 'macOS'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Install Linux dependencies (Ubuntu/Debian)
        if: steps.check_enabled.outputs.ENABLED == 'true' && runner.os == 'Linux'
        run: |
          sudo add-apt-repository -y universe || true
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libssl-dev build-essential libxdo-dev libayatana-appindicator3-dev || \
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libssl-dev build-essential libxdo-dev libappindicator3-dev

      - name: Build Standalone Binaries (Windows & Linux)
        if: steps.check_enabled.outputs.ENABLED == 'true' && runner.os != 'macOS'
        working-directory: src-tauri
        run: |
          cargo build --release --target ${{ matrix.target }} --bin fxtweet-cli --bin fxtweet-studio --bin fxtweet-viewer

      - name: Build Universal Binaries (macOS lipo)
        if: steps.check_enabled.outputs.ENABLED == 'true' && runner.os == 'macOS'
        working-directory: src-tauri
        run: |
          cargo build --release --target x86_64-apple-darwin --bin fxtweet-cli --bin fxtweet-studio --bin fxtweet-viewer
          cargo build --release --target aarch64-apple-darwin --bin fxtweet-cli --bin fxtweet-studio --bin fxtweet-viewer
          mkdir -p ../release-bin
          lipo -create -output ../release-bin/fxtweet-cli \
            target/x86_64-apple-darwin/release/fxtweet-cli \
            target/aarch64-apple-darwin/release/fxtweet-cli
          lipo -create -output ../release-bin/fxtweet-studio \
            target/x86_64-apple-darwin/release/fxtweet-studio \
            target/aarch64-apple-darwin/release/fxtweet-studio
          lipo -create -output ../release-bin/fxtweet-viewer \
            target/x86_64-apple-darwin/release/fxtweet-viewer \
            target/aarch64-apple-darwin/release/fxtweet-viewer

      - name: Package Desktop Artifacts (Windows)
        if: steps.check_enabled.outputs.ENABLED == 'true' && runner.os == 'Windows'
        run: |
          if (-not (Test-Path release-bin)) { New-Item -ItemType Directory -Path release-bin -Force }
          Copy-Item -Path src-tauri/target/${{ matrix.target }}/release/fxtweet-cli.exe -Destination release-bin/ -Force
          if (Test-Path src-tauri/target/${{ matrix.target }}/release/fxtweet-studio.exe) {
            Copy-Item -Path src-tauri/target/${{ matrix.target }}/release/fxtweet-studio.exe -Destination release-bin/ -Force
          }
          if (Test-Path src-tauri/target/${{ matrix.target }}/release/fxtweet-viewer.exe) {
            Copy-Item -Path src-tauri/target/${{ matrix.target }}/release/fxtweet-viewer.exe -Destination release-bin/ -Force
          }
          Copy-Item -Path README.md, DOCS.md, CLI.md -Destination release-bin/ -Force
          $MainZip = "fxtweet-studio-windows-x86_64-v${env:VERSION}.zip"
          Compress-Archive -Path release-bin/* -DestinationPath $MainZip -Force
          Copy-Item -Path $MainZip -Destination "fxtweet-studio-windows-cli.zip" -Force

      - name: Package Desktop Artifacts (macOS)
        if: steps.check_enabled.outputs.ENABLED == 'true' && runner.os == 'macOS'
        run: |
          cp README.md DOCS.md CLI.md release-bin/
          MAIN_TAR="fxtweet-studio-macos-universal-v${VERSION}.tar.gz"
          tar -czf "$MAIN_TAR" -C release-bin fxtweet-cli fxtweet-studio fxtweet-viewer README.md DOCS.md CLI.md
          cp "$MAIN_TAR" fxtweet-studio-macos-cli.tar.gz

      - name: Package Desktop Artifacts (Linux / Debian / Arch)
        if: steps.check_enabled.outputs.ENABLED == 'true' && runner.os == 'Linux'
        run: |
          mkdir -p release-bin
          cp src-tauri/target/${{ matrix.target }}/release/fxtweet-cli release-bin/
          if [ -f src-tauri/target/${{ matrix.target }}/release/fxtweet-studio ]; then
            cp src-tauri/target/${{ matrix.target }}/release/fxtweet-studio release-bin/
          fi
          if [ -f src-tauri/target/${{ matrix.target }}/release/fxtweet-viewer ]; then
            cp src-tauri/target/${{ matrix.target }}/release/fxtweet-viewer release-bin/
          fi
          cp README.md DOCS.md CLI.md release-bin/
          MAIN_TAR="fxtweet-studio-linux-x86_64-v${VERSION}.tar.gz"
          tar -czf "$MAIN_TAR" -C release-bin fxtweet-cli fxtweet-studio fxtweet-viewer README.md DOCS.md CLI.md
          cp "$MAIN_TAR" fxtweet-studio-linux-cli.tar.gz
          
          # Arch Linux PKGBUILD generation (self-contained package)
          {
            echo "# Maintainer: Hikaproj"
            echo "pkgname=fxtweet-studio-bin"
            echo "pkgver=${VERSION}"
            echo "pkgrel=1"
            echo 'pkgdesc="Ultra-fast Twitter/X bulk post and media archive studio by Hikaproj"'
            echo "arch=('x86_64')"
            echo 'url="https://github.com/Hikaproj/publictweetoutputter"'
            echo "license=('MIT')"
            echo "depends=('webkit2gtk-4.1' 'gtk3' 'openssl')"
            echo "source=('fxtweet-cli' 'fxtweet-studio' 'fxtweet-viewer')"
            echo "sha256sums=('SKIP' 'SKIP' 'SKIP')"
            echo 'package() {'
            echo '    install -Dm755 "${srcdir}/fxtweet-cli" "${pkgdir}/usr/bin/fxtweet-cli"'
            echo '    install -Dm755 "${srcdir}/fxtweet-studio" "${pkgdir}/usr/bin/fxtweet-studio"'
            echo '    install -Dm755 "${srcdir}/fxtweet-viewer" "${pkgdir}/usr/bin/fxtweet-viewer"'
            echo '}'
          } > release-bin/PKGBUILD
          tar -czf "fxtweet-studio-arch-x86_64-v${VERSION}.tar.gz" -C release-bin PKGBUILD fxtweet-cli fxtweet-studio fxtweet-viewer
          cp "fxtweet-studio-arch-x86_64-v${VERSION}.tar.gz" fxtweet-studio-arch-package.tar.gz

      - name: Upload Platform Artifacts
        if: steps.check_enabled.outputs.ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            *.zip
            *.tar.gz

  # --------------------------------------------------------------------------
  # 3. Create GitHub Release with Semantic Versioning and Attachments
  # --------------------------------------------------------------------------
  publish-release:
    name: Publish GitHub Release (by Hikaproj)
    needs: [package-nodejs, build-desktop]
    if: always() && !cancelled() && !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=v${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
            echo "TAG=v${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Copy Installers & Manifests to Release Assets
        if: github.event_name != 'workflow_dispatch' || inputs.include_installers
        run: |
          mkdir -p release-assets
          cp install.sh release-assets/
          cp install.ps1 release-assets/
          cp docker-compose.yml release-assets/
          cp Dockerfile release-assets/

      - name: Generate Checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt || true
          ls -la

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.TAG }}
          name: "Release ${{ steps.get_version.outputs.VERSION }} - FxTwitter Archive Studio"
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.is_draft || false }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.is_prerelease || false }}
          body: |
            ## FxTwitter Archive Studio ${{ steps.get_version.outputs.VERSION }}
            *Created by **Hikaproj***
            
            ### Quick Install & Run (Linux / macOS / Windows):
            ```bash
            # Linux (Debian, Arch, Ubuntu, Fedora) & macOS (Intel & Apple Silicon Universal)
            curl -fsSL https://raw.githubusercontent.com/Hikaproj/publictweetoutputter/main/install.sh | bash
            
            # Windows PowerShell (x86_64 / arm64)
            irm https://raw.githubusercontent.com/Hikaproj/publictweetoutputter/main/install.ps1 | iex
            ```

            ### Downloads:
            - **Windows GUI, Viewer & CLI**: `fxtweet-studio-windows-x86_64-v${{ steps.get_version.outputs.VERSION }}.zip` (contains `fxtweet-studio.exe` GUI, `fxtweet-viewer.exe` Viewer, and `fxtweet-cli.exe` CLI)
            - **macOS Universal GUI, Viewer & CLI**: `fxtweet-studio-macos-universal-v${{ steps.get_version.outputs.VERSION }}.tar.gz` (Universal binary for Intel & Apple Silicon)
            - **Linux GUI, Viewer & CLI**: `fxtweet-studio-linux-x86_64-v${{ steps.get_version.outputs.VERSION }}.tar.gz`
            - **Arch Linux Package**: `fxtweet-studio-arch-x86_64-v${{ steps.get_version.outputs.VERSION }}.tar.gz` (includes `PKGBUILD`)
            - **Docker Edition**: `fxtweet-studio-docker-v${{ steps.get_version.outputs.VERSION }}.zip` (Self-contained Dockerfile & compose)
            - **Node.js Edition**: `fxtweet-studio-nodejs-v${{ steps.get_version.outputs.VERSION }}.zip` / `.tar.gz`

            ### Features:
            - Ultra-fast asynchronous Twitter/X timeline and media backup using FxTwitter v2 API
            - Complete multi-account concurrent monitoring & continuous polling mode
            - Full locked account recovery with persistent polling & auto-resume
            - Full compression suite: `.zip`, `.tar.gz`, `.tar`, and `.xarchpjzip` format
            - Offline X-like interactive viewer with tweet screenshot export
            - Cross-platform native Rust desktop app & CLI binaries (Windows, macOS Universal, Linux x86_64 & Arch)
          files: release-assets/*
