[package]
name = "fxtweet-studio"
version = "1.0.0"
description = "Ultra-fast Twitter/X bulk post and media archive studio powered by FxTwitter API"
authors = ["Hikaproj"]
edition = "2021"
default-run = "fxtweet-studio"

[lib]
name = "fxtweet_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "fxtweet-studio"
path = "src/main.rs"

[[bin]]
name = "fxtweet-cli"
path = "src/bin/fxtweet-cli.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-opener = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3"
chrono = { version = "0.4", features = ["serde"] }
zip = { version = "2.1", default-features = false, features = ["deflate"] }
flate2 = "1.0"
tar = "0.4"
